# البوّاباتُ الخضراءُ الخمس — نفسُها التي تُشغَّلُ محلّيّاً قبلَ كلِّ commit.
#
# ⚠️ ولا حاويةَ خدمةٍ واحدة، وذلك مقصود. الاختباراتُ تعملُ على SQLite في الذاكرة
# و`SCOUT_DRIVER=null`، وكلاهما مكتوبٌ في `backend/phpunit.xml` منذ ٠٠١ — فإضافةُ
# MySQL أو Meilisearch هنا تُبطئُ كلَّ تشغيلةٍ وتُثبِتُ **بيئةً لا يستعملُها أحد**.
#
# ⚠️ و Playwright خارجَ هذا الملفِّ عمداً. تهيئتُه تبني للإنتاجِ وتحتاجُ خادمَين،
# وهو أربعُ دقائقَ مقابلَ ثانيتَين لـ`npm test` — وسؤالُه مختلفٌ أصلاً: «هل يعملُ
# المنتَجُ من طرفٍ إلى طرف» لا «هل يفعلُ هذا المكوّنُ ما يقول».

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # فتحُ التشغيلِ اليدويِّ من تبويبِ Actions — يُختصَرُ به وقتُ تشخيصِ فشلٍ عابر.
  workflow_dispatch:

# دفعةٌ جديدةٌ على الفرعِ نفسِه تُلغي السابقة: مراجعةُ نتيجةٍ عن كودٍ تجاوزَه
# صاحبُه بدقيقتَين هي دقائقُ حوسبةٍ لا يقرؤها أحد.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # ⚠️ أربعُ شرائحَ لأنّ `--parallel` يقفُ عندَ أنويةِ العدّاءِ الواحد.
    #
    # التوازي داخلَ الوظيفةِ أنزلَ pest من ٧٠٠ث إلى ٤٩٦ث ثمَّ ٤٣٠ث، وهو أقلُّ
    # بكثيرٍ ممّا يُعطيه على جهازِ تطويرٍ (٤٠م → ٧م، أي ٥×) لسببٍ واحد: عدَدُ
    # العمليّاتِ يتبعُ عددَ الأنوية، وعدّاءُ GitHub القياسيُّ ضيّقٌ فيها. والشريحةُ
    # عدّاءٌ آخرُ بأنويةٍ أخرى، فهي اللافعةُ الوحيدةُ التي تتجاوزُ ذلك السقف.
    #
    # ⚠️ ولا `shards.json` — وهذا اختيارٌ بثمنٍ معلوم. لِـPest توازنٌ زمنيٌّ عبرَ
    # `--update-shards`، وثمنُه ملفٌّ مُودَعٌ يبلى مع كلِّ اختبارٍ يُضاف، وهذه شجرةٌ
    # تُسجّلُ مراراً أنّ قائمةً ثانيةً تُجيبُ عن سؤالٍ واحدٍ تتباعدُ عن الأولى بصمت.
    #
    # والتقسيمُ بالعددِ مقيسٌ لا مُقدَّر (٢٠٢٦-٠٩-٠٧، أربعُ شرائحَ تسلسليّاً):
    #
    #     ١/٤  ٧١٦ اختباراً  ٢م١٣ث        ٣/٤  ٧٢٠  ٢م١٩ث
    #     ٢/٤  ٧٥٦ اختباراً  ١م٤٩ث        ٤/٤  ٧٢٠  ٣م٠١ث
    #
    # المجموعُ ٢٩١٢ — كلُّ اختبارٍ مرّةً واحدةً بالضبط. وزمنُ الجدارِ هو الأطولُ
    # (٣م٠١ث) مقابلَ ٦م٣٩ث للكاملِ في وظيفةٍ واحدة، بينما المثاليُّ الموزونُ نحوُ
    # ١م٤٥ث. أي أنّ الاختلالَ يكلّفُ نحوَ ٧٥ ثانيةً — ثمنٌ مقبولٌ لملفٍّ لا يبلى،
    # ويُعادُ النظرُ فيه لو اتّسعت الفجوةُ: `--update-shards` هو طريقُ الترقية.
    #
    # ⚠️ والثمنُ الحقيقيُّ دقائقُ العدّاء: أربعُ شرائحَ = أربعُ تهيئاتٍ (نحوَ ٤٠ث
    # لكلٍّ) مقابلَ زمنِ جدارٍ واحد. الدقائقُ تتضاعف؛ الانتظارُ ينقسم.
    name: Backend — pest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      # ⚠️ لا تُلغِ الأخواتِ عندَ سقوطِ واحدة: شريحةٌ حمراءُ وثلاثٌ خضراءُ تعني أنّ
      # العطلَ في تلك الشريحةِ وحدَها، وإلغاءُ البقيّةِ يُخفي ما إن كانت العلّةُ
      # أوسعَ — وهو أوّلُ سؤالٍ يسألُه قارئُ الفشل.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          # ⚠️ يطابقُ `docker/backend.Dockerfile` (php:8.5-fpm-alpine) لا الحدَّ
          # الأدنى في composer.json (^8.3). بيئةُ اختبارٍ أقدمُ من بيئةِ التشغيلِ
          # هي بوّابةٌ خضراءُ عن نسخةٍ لا تعملُ في الإنتاج.
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, mbstring, xml, bcmath, ctype, json, openssl, tokenizer, fileinfo, zip, gd, pcntl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install
        working-directory: backend
        # `--no-dev` ممنوعٌ هنا: Pest وPHPStan وPint كلُّها في require-dev.
        #
        # ⚠️ والمحاولةُ الثانيةُ مصدرٌ آخرُ لا إعادةُ محاولةٍ — وهي تحمي ما لا
        # تحميه الخطوةُ التي فوقها. `Cache Composer` هو ما أنجى هذا الملفَّ يومَ
        # سقطَ الإنتاجُ ثلاثَ مرّاتٍ (٢٠٢٦-٠٨-٣١): ثلاثُ حزمٍ من ١٧٣ تردُّ
        # `HTTP 400` على أرشيفِها عندَ GitHub، والذّاكرةُ أعادتِ الحزمَ بلا
        # تنزيلٍ فمرّت خضراء. **خضرةُ التخزينِ ليست دليلاً على أنَّ الحزمةَ
        # قابلةٌ للتنزيل**، وأوّلُ ذاكرةٍ باردةٍ — ترقيةُ PHP، تغيّرُ الـlock،
        # انتهاءُ صلاحيةِ المفتاح — تُوقِفُ كلَّ شيء.
        #
        # ⚠️ وحذفُ `--prefer-dist` وحدَهُ لا يُغيّرُ شيئاً: `composer.json` يحملُ
        # `preferred-install: "dist"`، فالسلوكُ واحدٌ بالعَلَمِ وبدونِه. الذي
        # يحمي هو المسارُ الثاني، وهو نفسُ ما في `docker/backend.Dockerfile`.
        run: |
          composer install --no-interaction --no-progress \
            || composer install --no-interaction --no-progress --prefer-source

      # ⚠️ لا `.env` على عامِلٍ نظيف، و`phpunit.xml` لا يضبطُ `APP_KEY` — فينفجرُ
      # `MissingAppKeyException` في أوّلِ اختبارٍ يلمسُ التشفيرَ أو الجلسة. سقطَ ١٨
      # اختباراً دفعةً واحدةً بهذا السبب، وكلُّ رسائلِها تتحدّثُ عن ٤٠٣ ومفاتيحَ
      # مفقودةٍ لا عن السبب. محلّيّاً غيرُ مرئيٍّ إطلاقاً: `backend/.env` موجودٌ منذ
      # أوّلِ يوم.
      - name: Environment
        working-directory: backend
        # ⚠️ ملفٌّ بمفتاحٍ واحدٍ فقط، **ولا نسخةَ من `.env.example`**. ذلك المثالُ
        # يحملُ قيماً إنتاجيّةً (`MEDIA_SOURCE_DISK=r2`) ومفاتيحَ معلَنةً فارغةً
        # يقرؤها `env()` سلسلةً فارغةً لا `null` — فنسخُه أسقطَ سبعَ حالاتٍ خضراءَ
        # محلّيّاً. بيئةُ الاختبارِ يحكمُها `phpunit.xml` وحدَه، و`APP_KEY` هو
        # الشيءُ الوحيدُ الذي لا يجوزُ أن يعيشَ في المستودع.
        run: |
          printf 'APP_KEY=\n' > .env
          php artisan key:generate

      - name: Tests (pest)
        working-directory: backend
        # ⚠️ `--parallel` لا يُنشئُ قاعدةَ بياناتٍ واحدةً، وهذا مكتوبٌ في الإطارِ لا
        # مُستنتَج: كلُّ نداءٍ يُنشئُ أو يُبدّلُ أو يحذفُ قاعدةً في
        # `Illuminate\Testing\Concerns\TestDatabases` ملفوفٌ في
        # `whenNotUsingInMemoryDatabase()`، وهي تعودُ صامتةً حينَ يكونُ
        # `DB::getConfig('database') === ':memory:'` — وهو ما يضبطُه `phpunit.xml`
        # منذ ٠٠١. فكلُّ عمليّةٍ تأخذُ قاعدتَها في ذاكرتِها وتموتُ معَها: لا ملفَّ
        # على القرص، ولا `test_db_1`، ولا اقترابَ من قاعدةِ أحد.
        #
        # ⚠️ ويحتاجُ `brianium/paratest` في require-dev — ولذلك لا يجوزُ `--no-dev`
        # في خطوةِ التركيبِ أعلاه، كما يقولُ تعليقُها.
        #
        # ⚠️ والشريحةُ **مع** التوازي لا بدلاً منه: الأولى تُقسِّمُ بينَ العدّاءين
        # والثاني يُقسِّمُ بينَ أنويةِ العدّاءِ الواحد، وهما سقفانِ مختلفان.
        run: php vendor/bin/pest --shard=${{ matrix.shard }}/4 --parallel

  # ⚠️ وظيفةٌ مستقلّةٌ لأنّ الأسلوبَ والتحليلَ الساكنَ يُقاسانِ الشجرةَ كلَّها مرّةً
  # واحدة. تركُهما داخلَ مصفوفةِ الشرائحِ يُشغِّلُهما أربعَ مرّاتٍ على نفسِ الملفّاتِ
  # — دقيقتانِ وربعٌ من دقائقِ العدّاءِ ثمناً لأربعةِ أجوبةٍ متطابقة.
  quality:
    name: Backend — pint · phpstan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_sqlite, mbstring, xml, bcmath, ctype, json, openssl, tokenizer, fileinfo, zip, gd, pcntl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress \
            || composer install --no-interaction --no-progress --prefer-source

      - name: Style (pint --test)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan L8)
        working-directory: backend
        # ⚠️ بلا خطِّ أساسٍ جديدٍ وبلا @phpstan-ignore — الشجرةُ نظيفةٌ ويجبُ أن تبقى.
        #
        # ⚠️ ولا خطوةَ `Environment` هنا: `phpstan` لا يُقلِعُ التطبيقَ ولا يلمسُ
        # `APP_KEY`. تلك الخطوةُ تخصُّ pest وحدَه، حيثُ غيابُها يُسقِطُ ثمانيةَ عشرَ
        # اختباراً برسائلَ لا تذكرُ السبب.
        run: ./vendor/bin/phpstan analyse --no-progress

  frontend:
    name: Frontend — tsc · vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ⚠️ 24, AND IT MUST MATCH `docker/frontend.Dockerfile` AND THE MACHINES
          # PEOPLE WORK ON. It was 20 while development ran on 24, and the cost was
          # not theoretical: `select-styling.test.ts` — the guard written to catch a
          # `<Select>` with no `className`, a defect a user had reported — imports
          # `globSync` from `node:fs`, which arrived in Node 22. It threw
          # `TypeError: globSync is not a function` on EVERY CI run from the day it
          # was written while passing on every developer machine, so the guard was
          # green locally and had never once executed in the place that gates a
          # merge. Raising this alone would only invert the hazard: CI would then
          # accept an API the production image cannot run.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Types
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Tests (vitest + jsdom)
        working-directory: frontend
        # ⚠️ `include` مقصورٌ على `src/**/*.test.{ts,tsx}` في التهيئة، فلا يبتلعُ
        # `e2e/*.spec.ts` ويموتُ داخلَ مُشغِّلِ Playwright.
        run: npm test

      - name: Production build
        working-directory: frontend
        # ⚠️ البناءُ بوّابةٌ بنفسِه ولا يُغني عنه `tsc`. مساران يتحلّلان إلى عنوانٍ
        # واحدٍ يجعلانِ **كلَّ صفحةٍ** ترُدُّ ٥٠٠ — ولا `tsc` ولا `npm test` يبنيان
        # المسارات، فقد شُحِنَ ذلك مرّةً وجلسَ جلسةً كاملة.
        #
        # ⚠️ ويبني **بلا API**، وذلك سؤالٌ مقصودٌ لا إهمال. صفحاتُ المتجرِ الأربعُ
        # تُهيَّأُ مسبقاً بجلبِ الـAPI، وكلٌّ منها يلتقطُ فشلَه ويرسمُ حالةَ خطأ —
        # فالبناءُ يجبُ أن ينجحَ على عامِلٍ لا خادمَ فيه. يومَ يفشلُ هنا بـ
        # `ECONNREFUSED` فذلك صفحةٌ جديدةٌ تجلبُ بلا `try`، وهي في الإنتاجِ صفحةٌ
        # تُسقِطُ نشرةً كاملةً لأنّ الـAPI تأخّرَ ثانيتَين عن الواجهة.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
