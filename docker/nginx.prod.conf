# قالبٌ لا ملفٌّ ثابت: صورةُ nginx الرسميّةُ تُمرِّرُ كلَّ ما في
# `/etc/nginx/templates/*.template` عبرَ `envsubst` عندَ الإقلاع، فيُملأُ
# `${DOMAIN}` من `.env` — بدلاً من نسخةٍ تُعدَّلُ باليد على كلِّ خادم.

# ── سياسةُ أمنِ المحتوى (CSP) ────────────────────────────────────────────
#
# ⚠️ **مُنفَّذةٌ منذُ ٢٠٢٦-٠٩-٢٤** بعدَ أن أُرسِلَت `Report-Only` أوّلاً. قيسَ قبلَ
# التبديلِ على الإنتاج: الرئيسيّةُ والكورساتُ و/login و/admin/login بلا مخالفةٍ
# واحدة (مع ضابطٍ موجبٍ: سكربتٌ من أصلٍ غريبٍ ظهرَ مخالفةً فعلاً)، وأصولُ الفيديو
# (`vz-….b-cdn.net`) والحصّة (`….livekit.cloud`) في `.env` الإنتاجِ تطابقُ القائمة.
# ⚠️ **العودةُ سطرٌ واحد إن انكسرَ شيء:** اسمُ الترويسةِ في `add_header` أسفلَ كتلةِ
# ٤٤٣ ← `Content-Security-Policy-Report-Only`. وأوّلُ ما يُفحَصُ عندَ فيديو لا يعملُ
# أو حصّةٍ لا تتّصلُ أو نقاشٍ لا يصلُ لحظيّاً: Console المتصفّح، بحثاً عن «Refused».
#
# ⚠️ مكانٌ واحدٌ للسطحَين، وهنا لا في `next.config.ts`: nginx يرى الطلبَ قبلَ
# Next وقبلَ Laravel، ويعرفُ `${DOMAIN}`، ولا يمسُّ خادمَ التطويرِ (`npm run dev`
# يحتاجُ `unsafe-eval` لإعادةِ التحميلِ الساخن، وسياسةٌ في Next كانت ستملأُ Console
# المطوّرِ ضجيجاً). ⚠️ فلا تُضَفْ CSP في Next أيضاً: ترويستانِ مُنفَّذتانِ **تتقاطعان**
# — أي أنّ الأصلَ يجبُ أن يكونَ في الاثنتَين — وهذا يُكتشَفُ بعدَ أن ينكسرَ شيء.
#
# وهي `map` لا `add_header` داخلَ كلِّ `location`: nginx يُورِّثُ `add_header` من
# الكتلةِ الأعلى **فقط** إن لم يكن في الـlocation واحدٌ خاصٌّ به، فترويسةٌ واحدةٌ
# في `location /admin` كانت ستُسقِطُ منه HSTS و`nosniff` و`X-Frame-Options` بصمت.
# وقيمةٌ فارغةٌ تعني أنّ nginx لا يُرسِلُ الترويسةَ أصلاً.
#
# ── الواجهة (Next.js) — لماذا كلُّ أصل:
#  script-src 'unsafe-inline'  Next (App Router) يحقنُ في كلِّ صفحةٍ سكربتاتٍ مضمَّنةً
#     (`self.__next_f.push(...)`) محتواها يتغيّرُ مع كلِّ صفحة، فلا بصمةَ (hash) تغطّيها.
#     والبديلُ nonce، وهو يتطلّبُ middleware ويُجبِرُ كلَّ صفحةٍ على التصييرِ الديناميّ
#     فيُسقِطُ `revalidate` الذي تقومُ عليه صفحاتُ المتجر. ⚠️ **ولا تُضَفْ بصمةُ سكربتِ
#     السِّمةِ في `app/layout.tsx` وحدَها**: وجودُ أيِّ hash أو nonce يجعلُ المتصفّحَ
#     يتجاهلُ `'unsafe-inline'` كلَّه، فتسقطُ سكربتاتُ Next نفسُها. إمّا nonce للجميع
#     لاحقاً، وإمّا `'unsafe-inline'` بلا بصمة — لا نصفُ الاثنَين.
#     و`application/ld+json` (JsonLd) بياناتٌ لا تُنفَّذ، فلا تحتاجُ شيئاً.
#  style-src 'unsafe-inline'   سماتُ `style=` في React، وأنماطُ مكوّناتِ LiveKit.
#  img-src https:              نصُّ Markdown الذي يكتبُه المدرّسُ قد يشيرُ إلى صورةٍ خارجيّة.
#  font-src 'self'             `next/font` يستضيفُ Cairo محلّيّاً؛ لا طلبَ إلى Google.
#  media-src *.b-cdn.net blob: المشغّلُ يُحوَّلُ بـ302 إلى منطقةِ Bunny؛ hls.js يغذّي
#     الفيديو من `blob:` (MSE)، وSafari يقرأُ رابطَ الـCDN مباشرةً (HLS أصليّ).
#  connect-src *.b-cdn.net     hls.js يجلبُ القوائمَ والمقاطعَ بـXHR، والـCSP يفحصُ
#     وجهةَ التحويلةِ أيضاً لا الرابطَ الأوّلَ وحدَه.
#  connect-src *.livekit.cloud `wss://` للغرفة، و`https://` لأنّ مكتبةَ LiveKit تجلبُ
#     `/settings/regions` من المضيفِ نفسِه قبلَ الاتّصال. ⚠️ افتراضٌ من أنّ الإنتاجَ على
#     LiveKit Cloud؛ إن كانَ `LIVEKIT_URL` مضيفاً آخرَ فالتقاريرُ ستُسمّيه.
#  connect-src wss://${DOMAIN} Reverb (`/app`) على المضيفِ نفسِه، و`'self'` يطابقُ wss
#     في CSP3 — والصريحُ لصفحةٍ فُتِحَت من `www.` بينما السوكِتُ على النطاقِ المجرَّد.
#  worker-src 'self' blob:     عاملُ الخدمة (إشعاراتُ الدفع)، وعاملُ hls.js المبنيُّ من blob.
#  frame-src                   يوتيوب (نسخةُ nocookie وحدَها) وVimeo — `lib/video-embed.ts`
#     لا يُنتِجُ غيرَهما؛ و`'self'` لعارضِ المستندات (`DocumentViewer`).
#
# ── اللوحة (/admin، /livewire، /panel، /horizon):
#  script-src 'unsafe-eval'    Alpine في Livewire يُقيِّمُ تعابيرَ `x-data` بـ`new Function`،
#     و`csp_safe` في Livewire على `false` (الافتراضيّ) لأنّ Filament لا يعملُ بنسخةِ
#     Alpine الآمنة. ونسخةُ Filament الساكنةُ ولوحةُ Horizon تحقنانِ سكربتاتٍ وأنماطاً مضمَّنة.
#  fonts.bunny.net             خطُّ لوحةِ Horizon (`layout.blade.php` في الحزمة). Filament
#     نفسُه يستعملُ `LocalFontProvider` لأنّ اللوحةَ لا تُعيِّنُ خطّاً.
#
# ── بلا سياسة: `/api` و`/storage` و`/sanctum` و`/broadcasting` — ليست صفحاتٍ بل
# JSON وملفّات، وعارضُ المستنداتِ يُضمِّنُ ردَّ `/api/playback/…` في iframe.
map $uri $content_security_policy {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https://*.b-cdn.net; connect-src 'self' wss://${DOMAIN} https://*.b-cdn.net https://*.livekit.cloud wss://*.livekit.cloud; worker-src 'self' blob:; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/(admin|livewire|panel|horizon)(/|$) "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.bunny.net; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    ~^/(api|storage|sanctum|broadcasting)/ "";
}

# ── ذاكرةُ المتصفّحِ لمستنداتِ Next ────────────────────────────────────
#
# ⛔ **قِيسَ على الإنتاجِ في ٢٠٢٦-٠٩-٢٤: كلُّ تبويبةٍ مفتوحةٍ قبلَ نشرةٍ تنكسرُ بعدَها.**
# الصفحاتُ المُصيَّرةُ مسبقاً تخرجُ من Next بـ
# `Cache-Control: s-maxage=300, stale-while-revalidate=31535700`
# (`x-nextjs-cache: HIT`، `x-nextjs-prerender: 1`). و`stale-while-revalidate`
# يأذنُ **للمتصفّحِ نفسِه** أن يعرضَ النسخةَ القديمةَ من ذاكرتِه سنةً كاملةً ويُحدِّثَها
# في الخلفية. فمن زارَ `/messages` قبلَ النشرةِ يفتحُها بعدَها بـHTML **القديم**،
# وهذا HTML يُسمّي حزماً حذفَها البناءُ الجديد
# (`/_next/static/chunks/5613-0374f08bd3eff5a8.js` ← ٤٠٤ بينما الجديدُ
# `5613-836749482bb11ad1.js`). وحين يكونُ المفقودُ حزمةَ التخطيطِ الجذريِّ نفسَها
# لا يصلُ حتى حدُّ الخطأِ (`app/error.tsx`) — تظهرُ جملةُ Next الإنجليزيّةُ الخام
# «Application error: a client-side exception has occurred». و`/family`، التي جُلِبَت
# طازجةً، كانت سليمة. ونحنُ ننشرُ مرّاتٍ في اليوم.
#
# فالمستندُ (HTML) وحمولةُ RSC (نفسُ المسارِ بـ`?_rsc=` وترويسةِ `RSC: 1`) لا
# يُعادُ استعمالُهما من ذاكرةِ المتصفّحِ بلا سؤالِ الخادم: `no-cache` يعني «اسألْ
# قبلَ كلِّ استعمال»، فيصلُ HTML الجديدُ الذي يُسمّي الحزمَ الموجودة.
# ⚠️ **و`/_next/` مستثناةٌ عمداً وتحتفظُ بترويسةِ Next**: `/_next/static` أسماؤها
# بصماتُ محتوى ومُرسَلةٌ `public, max-age=31536000, immutable` — وهذا صحيحٌ ويجبُ
# أن يبقى؛ و`/_next/image` لها مدّتُها الخاصّة. انظر `location ^~ /_next/` أسفل.
#
# ⚠️ **متغيّرٌ من `map` لا `add_header` داخلَ `location /`** — للسببِ المكتوبِ
# فوقَ `map $content_security_policy`: `add_header` واحدٌ في الـlocation يُسقِطُ
# منه كلَّ ترويساتِ الأمنِ الموروثةِ من الكتلة. القيمةُ فارغةٌ افتراضيّاً (فلا
# يُرسِلُ nginx شيئاً ولا تتضاعفُ ترويسةُ PHP في `/api` ولا `expires` في
# `/storage`)، و`location /` وحدَها تملؤها بـ`set`.
map $uri $next_document_cache_control {
    default "";
}

# ⚠️ المنفذُ ٨٠ لا يخدمُ شيئاً غيرَ تحدّي Let's Encrypt وإعادةِ التوجيه. تركُ
# التطبيقِ مفتوحاً عليه يعني أنّ رمزَ Sanctum يُرسَلُ نصّاً صريحاً لأوّلِ من يفتحُ
# العنوانَ بلا https — وهو ما يفعلُه كلُّ من يكتبُ النطاقَ في شريطِ العنوان.
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # يبقى مفتوحاً بلا تحويل: التجديدُ كلَّ اثنتَي عشرةَ ساعةً يمرُّ من هنا،
    # وتحويلُه إلى https يجعلُ الشهادةَ تُجدِّدُ نفسَها عبرَ شهادةٍ منتهية.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── منفذٌ داخليٌّ للتصييرِ من الخادم (SSR) ────────────────────────────────
#
# ⚠️ هذه الكتلةُ موجودةٌ لأنّ `http://nginx` وحدَه **لا يعمل**، وغيابُها خبزَ
# «تعذّر تحميل البيانات» في الصفحةِ الرئيسيّةِ إلى الأبد. صفحاتُ المتجرِ تُصيَّرُ
# على الخادمِ داخلَ حاويةِ الواجهة، فتطلبُ `/api` من nginx بالاسمِ الداخليّ — وكتلةُ
# المنفذِ ٨٠ أعلاه تُحوِّلُ كلَّ شيءٍ إلى https، فيرتدُّ الطلبُ `301` إلى
# `https://nginx/…`: مضيفٌ لا شهادةَ له ولا وجودَ له في DNS. الجلبُ يموت،
# `ErrorState` يُرسَمُ، وNext **يُخزِّنُ تلك الصفحةَ بنجاح** — فـ`revalidate` يُعيدُ
# إنتاجِ الفشلِ نفسِه كلَّ دقيقةٍ ولا يشفى شيء.
#
# ولا `ports:` لها في ملفِّ الحزمة: تُرى من شبكةِ Docker وحدَها.
server {
    listen 8081;
    server_name _;

    # ⚠️ فحصُ حياةِ nginx نفسِه، ولا يمرُّ بأيِّ خادمٍ خلفيّ — وهذا هو بيتُ
    # القصيد: فحصٌ على `/` يمرُّ إلى Next ثمّ إلى الـAPI، فتعثُّرُ الخادمِ
    # الخلفيِّ يُعلَّمُ **nginx** معتلّاً وهو سليم، أي اتّهامُ الحاويةِ الخطأ.
    # يردُّ نصّاً ثابتاً بلا سجلٍّ ولا معلومةٍ عن النظام.
    #
    # ⚠️ وهو هنا لا في كتلةِ ٤٤٣، وهذا هو ما أعطبَ الفحصَ أوّلَ نشرة: كتلةُ
    # المنفذِ ٨٠ تُحوِّلُ كلَّ شيءٍ إلى https، فيتبعُ `wget` التحويلةَ إلى
    # `https://127.0.0.1/…` ويسقطُ على التحقّقِ من الشهادةِ — العنوانُ ليسَ
    # النطاقَ الذي صدرَت له. هذه الكتلةُ لا شهادةَ لها ولا تحويل، ولا `ports:`
    # لها في ملفِّ الحزمة: يراها الفاحصُ من داخلِ الحاويةِ وحدَه، فلا تصيرُ
    # النقطةُ عنواناً عامّاً يُستطلَعُ من الخارج.
    location = /nginx-health { access_log off; add_header Content-Type text/plain; return 200 "ok
"; }

    # ⚠️ nginx يحلُّ اسمَ كلِّ خادمٍ أعلى **مرّةً واحدةً عندَ الإقلاعِ** ويحتفظُ
    # بالعنوانِ إلى الأبد. وDocker يمنحُ عنواناً جديداً لكلِّ حاويةٍ تُعادُ
    # إنشاؤها — نشرةٌ، أو انهيارٌ و`restart: unless-stopped` — فيبقى nginx
    # يطرقُ عنواناً لا أحدَ فيه ويرُدُّ ٥٠٢ إلى الأبد.
    #
    # قِيسَ على هذا الخادمِ في ٢٠٢٦-٠٨-٢٨: أُعيدَ إنشاءُ `reverb` بعدَ nginx بخمسِ
    # دقائق، فصارَ عنوانُه `172.19.0.6` وnginx يطلبُ `172.19.0.9`:
    # `connect() failed (111: Connection refused)` على **كلِّ** وصلةِ سوكِت.
    # ⚠️ والعرَضُ الوحيدُ الذي يراه المستخدمُ هو «النقاشُ لا يظهرُ لحظيّاً» —
    # لا خطأَ في الصفحةِ ولا في سجلِّ التطبيق، لأنّ الحفظَ هو المرجعُ (FR-048)
    # والرسالةُ تصلُ عندَ أوّلِ تحديث. عطلٌ صامتٌ بالكامل.
    #
    # `127.0.0.11` هو خادمُ أسماءِ Docker المدمج، و`valid=10s` يُجبِرُ إعادةَ
    # الحلّ. ⚠️ ولا يعملُ إلّا مع **متغيّرٍ** في `proxy_pass`/`fastcgi_pass`:
    # عنوانٌ حرفيٌّ يُحَلُّ وقتَ قراءةِ الإعدادِ ولا يمرُّ بالمُحلِّلِ أصلاً.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;


    client_max_body_size 512m;
    fastcgi_read_timeout 300s;

    root /var/www/html/public;

    location ^~ /api {
        include /etc/nginx/fastcgi_params;
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # ⚠️ المخطَّطُ يُعلَنُ `https` رغمَ أنّ الوصلةَ داخليّةٌ بلا تشفير: Laravel
        # يبني الروابطَ المطلقةَ من هذا، فبدونِه تخرجُ روابطُ الصورِ والشهاداتِ في
        # حمولةٍ صُيِّرَت على الخادمِ بـ`http://` وتُرفَضُ كمحتوًى مختلَطٍ في المتصفّح.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_NAME ${DOMAIN};
        fastcgi_param HTTP_HOST ${DOMAIN};
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    # لا شيءَ آخَرَ يُخدَمُ هنا: هذا بابُ الـSSR لا بابٌ ثانٍ للموقع.
    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ⚠️ nginx يحلُّ اسمَ كلِّ خادمٍ أعلى **مرّةً واحدةً عندَ الإقلاعِ** ويحتفظُ
    # بالعنوانِ إلى الأبد. وDocker يمنحُ عنواناً جديداً لكلِّ حاويةٍ تُعادُ
    # إنشاؤها — نشرةٌ، أو انهيارٌ و`restart: unless-stopped` — فيبقى nginx
    # يطرقُ عنواناً لا أحدَ فيه ويرُدُّ ٥٠٢ إلى الأبد.
    #
    # قِيسَ على هذا الخادمِ في ٢٠٢٦-٠٨-٢٨: أُعيدَ إنشاءُ `reverb` بعدَ nginx بخمسِ
    # دقائق، فصارَ عنوانُه `172.19.0.6` وnginx يطلبُ `172.19.0.9`:
    # `connect() failed (111: Connection refused)` على **كلِّ** وصلةِ سوكِت.
    # ⚠️ والعرَضُ الوحيدُ الذي يراه المستخدمُ هو «النقاشُ لا يظهرُ لحظيّاً» —
    # لا خطأَ في الصفحةِ ولا في سجلِّ التطبيق، لأنّ الحفظَ هو المرجعُ (FR-048)
    # والرسالةُ تصلُ عندَ أوّلِ تحديث. عطلٌ صامتٌ بالكامل.
    #
    # `127.0.0.11` هو خادمُ أسماءِ Docker المدمج، و`valid=10s` يُجبِرُ إعادةَ
    # الحلّ. ⚠️ ولا يعملُ إلّا مع **متغيّرٍ** في `proxy_pass`/`fastcgi_pass`:
    # عنوانٌ حرفيٌّ يُحَلُّ وقتَ قراءةِ الإعدادِ ولا يمرُّ بالمُحلِّلِ أصلاً.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;


    # ⚠️ الرفعُ يمرُّ من هنا قبلَ أن يراه PHP. الافتراضيُّ مليونُ بايتٍ، فإيصالُ
    # دفعٍ مصوَّرٌ بهاتفٍ حديثٍ يُرَدُّ بـ413 من nginx — بلا سطرٍ في سجلِّ التطبيق،
    # فيُقرَأُ على أنّه عطلٌ في شاشةِ الرفع. السقفُ الحقيقيُّ في `platform_settings`.
    client_max_body_size 512m;

    # مهلةٌ أطولُ من الافتراضيّ لرفعِ الوسائطِ الكبيرة على وصلةٍ منزليّة.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    fastcgi_read_timeout 300s;

    root /var/www/html/public;
    index index.php;

    # ── السوكِت ──────────────────────────────────────────────────────────
    #
    # ⚠️ قبلَ `location /`، لأنّ nginx يُطابِقُ البادئةَ الأطول: صفحةُ Next تجلبُ
    # `/app/...` من المتصفّح، ولو سبقَها التوجيهُ العامُّ لذهبَ التفاوضُ إلى Next
    # ورُدَّ ٤٠٤ — والنقاشُ عندَها «يعملُ متأخّراً» بلا خطأٍ يُسمّي السبب.
    location /app {
        # متغيّرٌ لا عنوانٌ حرفيّ — انظر ملاحظةَ `resolver` أعلى الكتلة.
        # و`$request_uri` صريحاً لأنّ nginx لا يُلحِقُ المسارَ خلفَ متغيّر.
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # السوكِت يبقى مفتوحاً بين الرسائل؛ مهلةُ القراءةِ الافتراضيّةُ تقطعُه
        # كلَّ دقيقةٍ فيُعيدُ العميلُ الاتّصالَ بلا انقطاعٍ ظاهرٍ وبكلفةٍ دائمة.
        proxy_read_timeout 3600s;
    }

    # ── المرفوعات ────────────────────────────────────────────────────────
    #
    # إيصالاتُ الدفعِ والصورُ الشخصيّة: قرصٌ عامٌّ يُخدَمُ بالمسار، بلا توقيع —
    # وهو مقصود: صورةٌ شخصيّةٌ ليست كائناً خاصّاً، والتسجيلُ المحميُّ يمرُّ من
    # `/api/playback/...` لا من هنا.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # ── أصولُ لوحةِ Filament الساكنة ──────────────────────────────────────
    #
    # ⚠️ قبلَ `location /`، ومحصورةٌ في `filament/` عمداً. اللوحةُ تطلبُ
    # `/css/filament/filament/app.css` وتسعةَ أخواتِها، ولا `location` كان
    # يُطابِقُها — فتذهبُ إلى Next.js وترُدُّ ٤٠٤ بنوعِ `text/html`. النتيجةُ لوحةٌ
    # تُفتَحُ **بلا تنسيقاتٍ ولا جافاسكربت** بينما HTML نفسُها ٢٠٠، فلا فحصُ
    # حالةٍ يرى العطل.
    #
    # ولا تُوسَّعُ إلى `/css/` و`/js/` المجرَّدتَين: `frontend/public/` تخدمُ من
    # الجذرِ أيضاً (`brand/` في الطرفَين بالفعل)، وبادئةٌ أوسعُ تسرقُ من Next
    # مساراتٍ تخصُّها. `filament/` هو الحدُّ الذي لا يتصادم.
    #
    # و`expires 1y` آمنةٌ لأنّ Filament يُلحِقُ `?v=5.7.1.0` — فترقيةُ النسخةِ
    # تُغيّرُ الرابطَ ولا يبقى شيءٌ قديمٌ في ذاكرةِ المتصفّح.
    location ^~ /css/filament/   { access_log off; expires 1y; try_files $uri =404; }
    location ^~ /js/filament/    { access_log off; expires 1y; try_files $uri =404; }
    location ^~ /fonts/filament/ { access_log off; expires 1y; try_files $uri =404; }

    # ── الواجهات الديناميّة (PHP) ────────────────────────────────────────
    #
    # ⚠️ مُتحكِّمٌ أماميٌّ واحدٌ لكلِّ المسارات، بلا `try_files` على ملفٍّ حقيقيّ:
    # nginx لا يحملُ نسخةً من شيفرةِ PHP في هذه الحزمة (لا مُجلَّدَ مشترَك)، فـ
    # `try_files $uri` سيفشلُ دائماً ويرُدُّ ٤٠٤ على كلِّ نقطةِ API. الملفُّ يُقرَأُ
    # في FPM من صورتِه هو، وهذا هو ما يمنعُ نسختَين متباعدتَين من الشيفرة.
    location ^~ /api      { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /admin    { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /horizon  { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    # ⛔ لا `location ^~ /docs` هنا عمداً: توثيقُ Scribe خريطةٌ كاملةٌ لكلِّ نقطةٍ
    # ومعاملٍ وشكلِ ردٍّ بلا مصادقة، وهو أداةُ تطوير. المسارُ لا يُسجَّلُ في
    # الإنتاجِ أصلاً (`config/scribe.php`)، و`/docs` هنا يسقطُ إلى Next ويردُّ ٤٠٤.
    location ^~ /livewire { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    # ⛔ **جسرُ الدخولِ إلى اللوحة — وغيابُه من هنا شحنَ نصفَ ميزةٍ إلى الإنتاج.**
    #
    # `‎/` في هذا الملفِّ لـNext، وLaravel يصلُه ما تذكرُه هذه القائمةُ **وحدَه**.
    # فمسارُ `web` جديدٌ يُكتَبُ في المستودعِ بلا سطرٍ هنا يُخدَمُ من Next ويردُّ
    # ٤٠٤ — قِيسَ على الإنتاجِ في ٢٠٢٦-٠٩-١٧: `‎/api/v1/auth/panel-ticket` أجابَ
    # ٤٠١ صحيحاً بينما `‎/panel/enter/{ticket}` أجابَ ٤٠٤، أي نصفُ الجسرِ يعملُ
    # ونصفُه لا يُوجَد. و`RouteReachabilityTest` يحرسُ هذا الآن.
    location ^~ /panel    { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /sanctum  { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /broadcasting { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }

    # ── أصولُ Next المبنيّة: تُمرَّرُ بترويسةِ ذاكرتِها كما هي ─────────────
    #
    # نفسُ التمريرِ الذي في `location /` أسفل، **بلا** `proxy_hide_header`: حزمُ
    # `/_next/static` أسماؤها بصماتٌ فتبقى `immutable` سنةً، و`/_next/image`
    # تحتفظُ بمدّتِها. انظر `map $next_document_cache_control` أعلى الملفّ.
    location ^~ /_next/ {
        set $next_upstream http://frontend:3000;
        proxy_pass $next_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── كلُّ ما بقي: الواجهة ─────────────────────────────────────────────
    location / {
        set $next_upstream http://frontend:3000;
        proxy_pass $next_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # ⛔ HTML وحمولةُ RSC لا تُعرَضُ من ذاكرةِ المتصفّحِ بعدَ نشرة — انظر
        # `map $next_document_cache_control` أعلى الملفّ للعطلِ المقيس. ترويسةُ
        # Next (`stale-while-revalidate` سنةً) تُحجَبُ، والبديلُ يُرسَلُ من
        # `add_header` على مستوى الكتلة كي لا تسقطَ ترويساتُ الأمن.
        proxy_hide_header Cache-Control;
        set $next_document_cache_control "private, no-cache, max-age=0, must-revalidate";
    }

    # ⚠️ `Referrer-Policy` لا يُضبَطُ أبداً على `no-referrer`. منطقةُ Bunny
    # ترُدُّ ٤٠٣ على طلبٍ بلا `Referer` — قِيسَ على حسابٍ حقيقيٍّ — فسياسةٌ تمنعُ
    # الترويسةَ تُعطِّلُ **كلَّ فيديو لكلِّ طالب**، والرفضُ يظهرُ عندَ الـCDN وحدَه.
    #
    # فهو مكتوبٌ الآن **بقيمتِه الافتراضيّةِ نفسِها** صراحةً، لا غائباً: القيمةُ التي
    # تُرسِلُ الأصلَ ويعملُ بها Bunny تُثبَّتُ هنا، فلا يُغيّرُها مكوّنٌ أو إعدادُ
    # إطارٍ دونَ أن يمرَّ بهذا السطرِ وتعليقِه.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ⚠️ الكاميرا والميكروفون ومشاركةُ الشاشةِ **مسموحةٌ للموقعِ نفسِه** — الحصّةُ
    # المباشرةُ لا تعملُ بدونِها — وممنوعةٌ على كلِّ إطارٍ مضمَّن (يوتيوب، Vimeo).
    # ⚠️ ولا يُذكَرُ هنا `fullscreen` ولا `picture-in-picture` ولا `encrypted-media`
    # ولا `autoplay`: قيمتُها الافتراضيّةُ تسمحُ للإطارِ بما يطلبُه في `allow=`،
    # وحصرُها بـ`self` يكسرُ ملءَ الشاشةِ في فيديو يوتيوبَ التعريفيِّ بصمت.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=()" always;

    # ⚠️ مُنفَّذة — انظر `map $content_security_policy` أعلى الملفّ. **للرجوعِ إلى
    # المراقبة:** أضِفْ `-Report-Only` إلى اسمِ الترويسةِ وحدَه. وقيمةٌ فارغةٌ (لـ`/api` مثلاً)
    # تعني أنّ nginx لا يُرسِلُها.
    add_header Content-Security-Policy $content_security_policy always;

    # فارغةٌ (فلا تُرسَلُ) إلّا في `location /` — انظر `map $next_document_cache_control`.
    add_header Cache-Control $next_document_cache_control always;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
