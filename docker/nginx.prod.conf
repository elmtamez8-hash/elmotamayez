# قالبٌ لا ملفٌّ ثابت: صورةُ nginx الرسميّةُ تُمرِّرُ كلَّ ما في
# `/etc/nginx/templates/*.template` عبرَ `envsubst` عندَ الإقلاع، فيُملأُ
# `${DOMAIN}` من `.env` — بدلاً من نسخةٍ تُعدَّلُ باليد على كلِّ خادم.

# ⚠️ المنفذُ ٨٠ لا يخدمُ شيئاً غيرَ تحدّي Let's Encrypt وإعادةِ التوجيه. تركُ
# التطبيقِ مفتوحاً عليه يعني أنّ رمزَ Sanctum يُرسَلُ نصّاً صريحاً لأوّلِ من يفتحُ
# العنوانَ بلا https — وهو ما يفعلُه كلُّ من يكتبُ النطاقَ في شريطِ العنوان.
server {
    listen 80;
    server_name ${DOMAIN} www.${DOMAIN};

    # يبقى مفتوحاً بلا تحويل: التجديدُ كلَّ اثنتَي عشرةَ ساعةً يمرُّ من هنا،
    # وتحويلُه إلى https يجعلُ الشهادةَ تُجدِّدُ نفسَها عبرَ شهادةٍ منتهية.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── منفذٌ داخليٌّ للتصييرِ من الخادم (SSR) ────────────────────────────────
#
# ⚠️ هذه الكتلةُ موجودةٌ لأنّ `http://nginx` وحدَه **لا يعمل**، وغيابُها خبزَ
# «تعذّر تحميل البيانات» في الصفحةِ الرئيسيّةِ إلى الأبد. صفحاتُ المتجرِ تُصيَّرُ
# على الخادمِ داخلَ حاويةِ الواجهة، فتطلبُ `/api` من nginx بالاسمِ الداخليّ — وكتلةُ
# المنفذِ ٨٠ أعلاه تُحوِّلُ كلَّ شيءٍ إلى https، فيرتدُّ الطلبُ `301` إلى
# `https://nginx/…`: مضيفٌ لا شهادةَ له ولا وجودَ له في DNS. الجلبُ يموت،
# `ErrorState` يُرسَمُ، وNext **يُخزِّنُ تلك الصفحةَ بنجاح** — فـ`revalidate` يُعيدُ
# إنتاجِ الفشلِ نفسِه كلَّ دقيقةٍ ولا يشفى شيء.
#
# ولا `ports:` لها في ملفِّ الحزمة: تُرى من شبكةِ Docker وحدَها.
server {
    listen 8081;
    server_name _;

    # ⚠️ nginx يحلُّ اسمَ كلِّ خادمٍ أعلى **مرّةً واحدةً عندَ الإقلاعِ** ويحتفظُ
    # بالعنوانِ إلى الأبد. وDocker يمنحُ عنواناً جديداً لكلِّ حاويةٍ تُعادُ
    # إنشاؤها — نشرةٌ، أو انهيارٌ و`restart: unless-stopped` — فيبقى nginx
    # يطرقُ عنواناً لا أحدَ فيه ويرُدُّ ٥٠٢ إلى الأبد.
    #
    # قِيسَ على هذا الخادمِ في ٢٠٢٦-٠٨-٢٨: أُعيدَ إنشاءُ `reverb` بعدَ nginx بخمسِ
    # دقائق، فصارَ عنوانُه `172.19.0.6` وnginx يطلبُ `172.19.0.9`:
    # `connect() failed (111: Connection refused)` على **كلِّ** وصلةِ سوكِت.
    # ⚠️ والعرَضُ الوحيدُ الذي يراه المستخدمُ هو «النقاشُ لا يظهرُ لحظيّاً» —
    # لا خطأَ في الصفحةِ ولا في سجلِّ التطبيق، لأنّ الحفظَ هو المرجعُ (FR-048)
    # والرسالةُ تصلُ عندَ أوّلِ تحديث. عطلٌ صامتٌ بالكامل.
    #
    # `127.0.0.11` هو خادمُ أسماءِ Docker المدمج، و`valid=10s` يُجبِرُ إعادةَ
    # الحلّ. ⚠️ ولا يعملُ إلّا مع **متغيّرٍ** في `proxy_pass`/`fastcgi_pass`:
    # عنوانٌ حرفيٌّ يُحَلُّ وقتَ قراءةِ الإعدادِ ولا يمرُّ بالمُحلِّلِ أصلاً.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;


    client_max_body_size 512m;
    fastcgi_read_timeout 300s;

    root /var/www/html/public;

    location ^~ /api {
        include /etc/nginx/fastcgi_params;
        set $php_upstream backend:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # ⚠️ المخطَّطُ يُعلَنُ `https` رغمَ أنّ الوصلةَ داخليّةٌ بلا تشفير: Laravel
        # يبني الروابطَ المطلقةَ من هذا، فبدونِه تخرجُ روابطُ الصورِ والشهاداتِ في
        # حمولةٍ صُيِّرَت على الخادمِ بـ`http://` وتُرفَضُ كمحتوًى مختلَطٍ في المتصفّح.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param SERVER_NAME ${DOMAIN};
        fastcgi_param HTTP_HOST ${DOMAIN};
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    # لا شيءَ آخَرَ يُخدَمُ هنا: هذا بابُ الـSSR لا بابٌ ثانٍ للموقع.
    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN} www.${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ⚠️ nginx يحلُّ اسمَ كلِّ خادمٍ أعلى **مرّةً واحدةً عندَ الإقلاعِ** ويحتفظُ
    # بالعنوانِ إلى الأبد. وDocker يمنحُ عنواناً جديداً لكلِّ حاويةٍ تُعادُ
    # إنشاؤها — نشرةٌ، أو انهيارٌ و`restart: unless-stopped` — فيبقى nginx
    # يطرقُ عنواناً لا أحدَ فيه ويرُدُّ ٥٠٢ إلى الأبد.
    #
    # قِيسَ على هذا الخادمِ في ٢٠٢٦-٠٨-٢٨: أُعيدَ إنشاءُ `reverb` بعدَ nginx بخمسِ
    # دقائق، فصارَ عنوانُه `172.19.0.6` وnginx يطلبُ `172.19.0.9`:
    # `connect() failed (111: Connection refused)` على **كلِّ** وصلةِ سوكِت.
    # ⚠️ والعرَضُ الوحيدُ الذي يراه المستخدمُ هو «النقاشُ لا يظهرُ لحظيّاً» —
    # لا خطأَ في الصفحةِ ولا في سجلِّ التطبيق، لأنّ الحفظَ هو المرجعُ (FR-048)
    # والرسالةُ تصلُ عندَ أوّلِ تحديث. عطلٌ صامتٌ بالكامل.
    #
    # `127.0.0.11` هو خادمُ أسماءِ Docker المدمج، و`valid=10s` يُجبِرُ إعادةَ
    # الحلّ. ⚠️ ولا يعملُ إلّا مع **متغيّرٍ** في `proxy_pass`/`fastcgi_pass`:
    # عنوانٌ حرفيٌّ يُحَلُّ وقتَ قراءةِ الإعدادِ ولا يمرُّ بالمُحلِّلِ أصلاً.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;


    # ⚠️ الرفعُ يمرُّ من هنا قبلَ أن يراه PHP. الافتراضيُّ مليونُ بايتٍ، فإيصالُ
    # دفعٍ مصوَّرٌ بهاتفٍ حديثٍ يُرَدُّ بـ413 من nginx — بلا سطرٍ في سجلِّ التطبيق،
    # فيُقرَأُ على أنّه عطلٌ في شاشةِ الرفع. السقفُ الحقيقيُّ في `platform_settings`.
    client_max_body_size 512m;

    # مهلةٌ أطولُ من الافتراضيّ لرفعِ الوسائطِ الكبيرة على وصلةٍ منزليّة.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    fastcgi_read_timeout 300s;

    root /var/www/html/public;
    index index.php;

    # ── السوكِت ──────────────────────────────────────────────────────────
    #
    # ⚠️ قبلَ `location /`، لأنّ nginx يُطابِقُ البادئةَ الأطول: صفحةُ Next تجلبُ
    # `/app/...` من المتصفّح، ولو سبقَها التوجيهُ العامُّ لذهبَ التفاوضُ إلى Next
    # ورُدَّ ٤٠٤ — والنقاشُ عندَها «يعملُ متأخّراً» بلا خطأٍ يُسمّي السبب.
    location /app {
        # متغيّرٌ لا عنوانٌ حرفيّ — انظر ملاحظةَ `resolver` أعلى الكتلة.
        # و`$request_uri` صريحاً لأنّ nginx لا يُلحِقُ المسارَ خلفَ متغيّر.
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # السوكِت يبقى مفتوحاً بين الرسائل؛ مهلةُ القراءةِ الافتراضيّةُ تقطعُه
        # كلَّ دقيقةٍ فيُعيدُ العميلُ الاتّصالَ بلا انقطاعٍ ظاهرٍ وبكلفةٍ دائمة.
        proxy_read_timeout 3600s;
    }

    # ── المرفوعات ────────────────────────────────────────────────────────
    #
    # إيصالاتُ الدفعِ والصورُ الشخصيّة: قرصٌ عامٌّ يُخدَمُ بالمسار، بلا توقيع —
    # وهو مقصود: صورةٌ شخصيّةٌ ليست كائناً خاصّاً، والتسجيلُ المحميُّ يمرُّ من
    # `/api/playback/...` لا من هنا.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # ── أصولُ لوحةِ Filament الساكنة ──────────────────────────────────────
    #
    # ⚠️ قبلَ `location /`، ومحصورةٌ في `filament/` عمداً. اللوحةُ تطلبُ
    # `/css/filament/filament/app.css` وتسعةَ أخواتِها، ولا `location` كان
    # يُطابِقُها — فتذهبُ إلى Next.js وترُدُّ ٤٠٤ بنوعِ `text/html`. النتيجةُ لوحةٌ
    # تُفتَحُ **بلا تنسيقاتٍ ولا جافاسكربت** بينما HTML نفسُها ٢٠٠، فلا فحصُ
    # حالةٍ يرى العطل.
    #
    # ولا تُوسَّعُ إلى `/css/` و`/js/` المجرَّدتَين: `frontend/public/` تخدمُ من
    # الجذرِ أيضاً (`brand/` في الطرفَين بالفعل)، وبادئةٌ أوسعُ تسرقُ من Next
    # مساراتٍ تخصُّها. `filament/` هو الحدُّ الذي لا يتصادم.
    #
    # و`expires 1y` آمنةٌ لأنّ Filament يُلحِقُ `?v=5.7.1.0` — فترقيةُ النسخةِ
    # تُغيّرُ الرابطَ ولا يبقى شيءٌ قديمٌ في ذاكرةِ المتصفّح.
    location ^~ /css/filament/   { access_log off; expires 1y; try_files $uri =404; }
    location ^~ /js/filament/    { access_log off; expires 1y; try_files $uri =404; }
    location ^~ /fonts/filament/ { access_log off; expires 1y; try_files $uri =404; }

    # ── الواجهات الديناميّة (PHP) ────────────────────────────────────────
    #
    # ⚠️ مُتحكِّمٌ أماميٌّ واحدٌ لكلِّ المسارات، بلا `try_files` على ملفٍّ حقيقيّ:
    # nginx لا يحملُ نسخةً من شيفرةِ PHP في هذه الحزمة (لا مُجلَّدَ مشترَك)، فـ
    # `try_files $uri` سيفشلُ دائماً ويرُدُّ ٤٠٤ على كلِّ نقطةِ API. الملفُّ يُقرَأُ
    # في FPM من صورتِه هو، وهذا هو ما يمنعُ نسختَين متباعدتَين من الشيفرة.
    location ^~ /api      { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /admin    { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /horizon  { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /docs     { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /livewire { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /sanctum  { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }
    location ^~ /broadcasting { include /etc/nginx/fastcgi_params; set $php_upstream backend:9000; fastcgi_pass $php_upstream; fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php; fastcgi_param SCRIPT_NAME /index.php; }

    # ── كلُّ ما بقي: الواجهة ─────────────────────────────────────────────
    location / {
        set $next_upstream http://frontend:3000;
        proxy_pass $next_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ⚠️ `Referrer-Policy` ليس هنا عمداً، ولا يُضافُ بـ`no-referrer`. منطقةُ Bunny
    # ترُدُّ ٤٠٣ على طلبٍ بلا `Referer` — قِيسَ على حسابٍ حقيقيٍّ — فسياسةٌ تمنعُ
    # الترويسةَ تُعطِّلُ **كلَّ فيديو لكلِّ طالب**، والرفضُ يظهرُ عندَ الـCDN وحدَه.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
