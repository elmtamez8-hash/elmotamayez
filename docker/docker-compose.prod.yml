# الحزمةُ الإنتاجيّة — نطاقٌ واحدٌ خلفَ nginx، وكلُّ سرٍّ من ملفِّ `.env`
# بجانبِ هذا الملفِّ على الخادم، **ولا شيءَ منه في المستودع**.
#
# ⚠️ ملفٌّ منفصلٌ عن `docker-compose.yml` وليس امتداداً له، والفرقُ ليس ذوقاً:
# ملفُّ التطويرِ يربطُ الشيفرةَ من القرصِ (`../backend:/var/www/html`) فتُظلِّلُ
# الحاويةَ ويُلغى `composer install` الذي بُنِيَت به، ويحملُ كلماتِ مرورٍ ثابتةً
# (`secret`, `root`) صالحةً على جهازٍ لا يصلُ إليه أحد. تشغيلُ أيٍّ من الاثنَين
# على خادمٍ عامٍّ هو تسليمُ قاعدةِ البياناتِ لأوّلِ من يمسح المنفذ.
#
#   docker compose -f docker/docker-compose.prod.yml --env-file docker/.env up -d --build
#
# ⚠️ ولا `ports:` على mysql ولا redis ولا meilisearch. الشبكةُ الداخليّةُ تكفي
# الحاوياتِ، ونشرُ ٣٣٠٦ على IP عامٍّ هو ما تبحثُ عنه ماسحاتُ الإنترنت بالدقيقة.

name: elmotamayez

services:
  backend:
    # ⚠️ FPM يتكلّمُ FastCGI لا HTTP، فلا `curl` يصلُ إليه من داخلِ حاويتِه —
    # والفحصُ اتّصالُ TCP بمنفذِه عبرَ PHP نفسِه، الأداةِ الوحيدةِ المضمونةِ هنا.
    #
    # ⚠️ وسقفُه مكتوبٌ عمداً: يُثبتُ أنّ FPM **يقبلُ اتّصالاً**، لا أنّ التطبيقَ
    # يُقلعُ ولا أنّ العمّالَ متفرّغون. الفحصُ الكاملُ يمرُّ من nginx، وهو ما
    # يقيسُه فحصُ nginx أدناه.
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    image: elmotamayez-backend:latest
    restart: unless-stopped
    working_dir: /var/www/html
    # ⚠️ لا ربطَ للشيفرة. الصورةُ هي النشرة؛ مجلَّدان فقط يعيشان أطولَ منها:
    # المرفوعاتُ (إيصالاتُ الدفعِ والوسائط) وسجلُّ التخزين.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - storage:/var/www/html/storage/app
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      # ⚠️ `MEILISEARCH_HOST` هو ما يقرؤه `config/scout.php` حرفيّاً. كان هنا
      # `SCOUT_MEILISEARCH_HOST` — اسمٌ لا يقرؤه أحد — فيسقطُ إلى الافتراضيِّ
      # `http://localhost:7700`، أي داخلَ حاويةِ الواجهةِ الخلفيّةِ حيث لا شيءَ
      # يستمع. النتيجةُ أنّ كلَّ كتابةٍ لنموذجٍ مفهرَسٍ تفشل: مدرّسٌ يُنشئُ مادّةً
      # يُرَدُّ بخطأ، والمتجرُ لا يجدُ شيئاً — بلا سطرٍ يُسمّي السبب.
      MEILISEARCH_HOST: http://meilisearch:7700
      # ⚠️ العنوانُ العامُّ للموقع، وغيابُه كانَ يُسقِطُ أربعةَ أشياءَ في صمت.
      # `config/cms.php` و`config/cors.php` يقرآنِ `FRONTEND_URL` ويسقطانِ إلى
      # `http://localhost:3000` — وهو داخلَ الحاويةِ عنوانٌ لا شيءَ عليه. فرابطُ
      # «الصفحة الرئيسية» في لوحةِ الأدمنِ كانَ يقودُ إلى localhost (بلاغُ مالك،
      # 2026-08-31)، و`PingSearchEnginesJob` كانَ يُبلِّغُ محرّكاتِ البحثِ بعناوينِ
      # localhost، وقائمةُ CORS كانت تسمحُ لأصلٍ ليس أصلَ الموقع.
      #
      # وهو `${APP_URL}` لأنّ nginx يخدمُ الاثنَين من مضيفٍ واحدٍ في الإنتاج:
      # `/` تذهبُ إلى Next و`/admin` إلى Laravel. فجذرُ الموقعِ العامِّ هو
      # عنوانُ التطبيقِ نفسُه — على خلافِ التطويرِ المحلّيِّ حيثُ هما منفذان.
      FRONTEND_URL: ${APP_URL}
    networks: [elmotamayez]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }

  # ⚠️ العاملُ خدمةٌ قائمةٌ بذاتِها ولا يُنسى. طابورٌ بلا عاملٍ **لا يُخطئ**:
  # المهامُّ تدخلُه ولا تُصرَف — فالإشعاراتُ لا تصل، والتسجيلاتُ لا تُبتلَع،
  # وأجرُ المدرّسِ يبقى محجوزاً، ولوحةُ التحكّمِ لا تقولُ شيئاً.
  horizon:
    image: elmotamayez-backend:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    # ⚠️ `horizon:status` يُرجعُ ٠ يعمل · ١ موقوف · ٢ خامل — مقيسٌ من مصدرِ
    # الحزمةِ لا من وثيقةٍ فوقَه. و«موقوف» يُعَدُّ اعتلالاً عمداً: Horizon
    # الموقوفُ لا يُصرّفُ شيئاً، وهي بالضبطِ الحالةُ التي يُراقَبُ من أجلِها.
    #
    # ⚠️ وهو يقرأُ Redis، فسقوطُ Redis يُعلَّمُ هنا أيضاً — وذلكَ صحيح: Horizon
    # بلا Redis لا يعملُ مهما بدا حيّاً.
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - storage:/var/www/html/storage/app
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      # ⚠️ `MEILISEARCH_HOST` هو ما يقرؤه `config/scout.php` حرفيّاً. كان هنا
      # `SCOUT_MEILISEARCH_HOST` — اسمٌ لا يقرؤه أحد — فيسقطُ إلى الافتراضيِّ
      # `http://localhost:7700`، أي داخلَ حاويةِ الواجهةِ الخلفيّةِ حيث لا شيءَ
      # يستمع. النتيجةُ أنّ كلَّ كتابةٍ لنموذجٍ مفهرَسٍ تفشل: مدرّسٌ يُنشئُ مادّةً
      # يُرَدُّ بخطأ، والمتجرُ لا يجدُ شيئاً — بلا سطرٍ يُسمّي السبب.
      MEILISEARCH_HOST: http://meilisearch:7700
      # ⚠️ العنوانُ العامُّ للموقع، وغيابُه كانَ يُسقِطُ أربعةَ أشياءَ في صمت.
      # `config/cms.php` و`config/cors.php` يقرآنِ `FRONTEND_URL` ويسقطانِ إلى
      # `http://localhost:3000` — وهو داخلَ الحاويةِ عنوانٌ لا شيءَ عليه. فرابطُ
      # «الصفحة الرئيسية» في لوحةِ الأدمنِ كانَ يقودُ إلى localhost (بلاغُ مالك،
      # 2026-08-31)، و`PingSearchEnginesJob` كانَ يُبلِّغُ محرّكاتِ البحثِ بعناوينِ
      # localhost، وقائمةُ CORS كانت تسمحُ لأصلٍ ليس أصلَ الموقع.
      #
      # وهو `${APP_URL}` لأنّ nginx يخدمُ الاثنَين من مضيفٍ واحدٍ في الإنتاج:
      # `/` تذهبُ إلى Next و`/admin` إلى Laravel. فجذرُ الموقعِ العامِّ هو
      # عنوانُ التطبيقِ نفسُه — على خلافِ التطويرِ المحلّيِّ حيثُ هما منفذان.
      FRONTEND_URL: ${APP_URL}
    networks: [elmotamayez]
    depends_on:
      backend: { condition: service_started }

  # ⚠️ والمُجدوِلُ خدمةٌ ثالثة، وغيابُه أهدأُ من غيابِ العامل. عليه تعتمدُ كنسةُ
  # الاحتفاظِ وإعادةُ محاولةِ التسجيلاتِ ومزامنةُ عدّاداتِ المدرّسِ وتذكيرُ الخمول —
  # كلُّها تصمتُ بلا صفٍّ في `failed_jobs` يشيرُ إليها.
  scheduler:
    image: elmotamayez-backend:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    # ⚠️ لا أمرَ حالةٍ للمجدوِل، فالنبضةُ في `routes/console.php` هي الجواب:
    # لمسةُ ملفٍّ كلَّ دقيقة، وهذا يقرأُ عمرَها. ثلاثُ دقائقَ لا دقيقتان —
    # المجدوِلُ ليسَ دقيقاً إلى الثانية، ونافذةٌ ضيّقةٌ تُعلِّمُ حاويةً سليمةً
    # معتلّةً كلَّ ليلةٍ عندَ أوّلِ مهمّةٍ ثقيلة.
    #
    # ⚠️ و`start_period` أطولُ من الفترةِ عمداً: الملفُّ لا يوجدُ قبلَ أوّلِ
    # نبضة، و`stat` عليه يفشل — فبدونِها تُولَدُ الحاويةُ معتلّةً دائماً.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /var/www/html/storage/app/scheduler-heartbeat) )) -lt 180"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 150s
    volumes:
      - storage:/var/www/html/storage/app
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      # ⚠️ العنوانُ العامُّ للموقع، وغيابُه كانَ يُسقِطُ أربعةَ أشياءَ في صمت.
      # `config/cms.php` و`config/cors.php` يقرآنِ `FRONTEND_URL` ويسقطانِ إلى
      # `http://localhost:3000` — وهو داخلَ الحاويةِ عنوانٌ لا شيءَ عليه. فرابطُ
      # «الصفحة الرئيسية» في لوحةِ الأدمنِ كانَ يقودُ إلى localhost (بلاغُ مالك،
      # 2026-08-31)، و`PingSearchEnginesJob` كانَ يُبلِّغُ محرّكاتِ البحثِ بعناوينِ
      # localhost، وقائمةُ CORS كانت تسمحُ لأصلٍ ليس أصلَ الموقع.
      #
      # وهو `${APP_URL}` لأنّ nginx يخدمُ الاثنَين من مضيفٍ واحدٍ في الإنتاج:
      # `/` تذهبُ إلى Next و`/admin` إلى Laravel. فجذرُ الموقعِ العامِّ هو
      # عنوانُ التطبيقِ نفسُه — على خلافِ التطويرِ المحلّيِّ حيثُ هما منفذان.
      FRONTEND_URL: ${APP_URL}
    networks: [elmotamayez]
    depends_on:
      backend: { condition: service_started }

  # ⚠️ Reverb هو السوكِت، وبدونه النقاشُ **يعملُ متأخّراً** لا ينكسر: الحفظُ هو
  # المرجعُ (FR-048) والرسالةُ تُقرأُ عندَ أوّلِ تحديث. فغيابُه عطلٌ صامتٌ يُشتكى
  # منه بجملةِ «النقاش لا يظهر لحظيّاً» ولا يظهرُ في أيِّ سجلّ.
  reverb:
    image: elmotamayez-backend:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    # ⚠️ `/up` مسارٌ تُصرِّحُ به الحزمةُ نفسُها (`HealthCheckController`) ويردُّ
    # `{"health":"OK"}` — لا تخمينَ فيه ولا مسارَ اخترعناه. و`curl` مثبَّتٌ في
    # الصورةِ (`backend.Dockerfile`)، و`-f` هي ما يجعلُ ٤٠٤ فشلاً.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    networks: [elmotamayez]
    depends_on:
      backend: { condition: service_started }

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        # ⚠️ قيمُ `NEXT_PUBLIC_*` تُدمَجُ في الحزمةِ وقتَ **البناء**، لا وقتَ
        # التشغيل. تمريرُها في `environment:` وحدَه يشحنُ صفحةً تحملُ القيمةَ
        # الفارغةَ التي بُنِيَت بها، بلا خطأٍ في أيِّ مكان.
        NEXT_PUBLIC_APP_URL: ${APP_URL}
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_PUBLIC_HOST}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PUBLIC_PORT}
        NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_PUBLIC_SCHEME}
    image: elmotamayez-frontend:latest
    restart: unless-stopped
    # ⚠️ اتّصالُ TCP لا طلبُ HTTP على `/`، **وهذا قرارٌ لا كسل**. الصفحةُ
    # الرئيسيّةُ تُصيَّرُ على الخادمِ بجلبٍ من الـAPI، فتعثّرُ الخادمِ الخلفيِّ
    # كانَ سيُعلِّمُ **الواجهةَ** معتلّةً وهي سليمة — أي اتّهامُ الحاويةِ الخطأ،
    # ومع أيِّ آليّةِ إحياءٍ لاحقاً: إعادةُ تشغيلٍ لا تُصلحُ شيئاً وتقطعُ الزوّار.
    # وNext لا يُصدّرُ مسارَ صحّةٍ خاصّاً به، ولا نخترعُ واحداً لأجلِ فحص.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      NODE_ENV: production
      # ⚠️ لِما يجلبُه Next من **داخلِ** الحاوية أثناءَ التصييرِ على الخادم.
      # `localhost:8000` هناك هو منفذُ الواجهةِ نفسِها ولا شيءَ يستمع — و
      # `http://nginx` (المنفذُ ٨٠) يرتدُّ `301` إلى `https://nginx/…`، مضيفٍ بلا
      # شهادةٍ ولا DNS. المنفذُ ٨٠٨١ كتلةٌ داخليّةٌ بلا تحويل، غيرُ منشورةٍ للمضيف.
      API_ORIGIN: http://nginx:8081

      # ⚠️ ومتغيّرٌ ثانٍ لأنّ القارئَين اثنان، وهذا هو الذي كان يُسقِطُ الصفحةَ
      # الرئيسيّة. `next.config.ts` يقرأُ `API_ORIGIN` لإعادةِ الكتابة — وهي لا
      # تنطبقُ على جلبٍ **صادرٍ** من كودِ الخادمِ أصلاً — بينما
      # `lib/public-api.ts`، وهو العميلُ الذي تستعملُه صفحاتُ المتجرِ فعلاً، يقرأُ
      # `MARKETPLACE_API_URL` ويرتدُّ إلى `http://localhost:8000` داخلَ حاويةِ
      # الواجهةِ حيثُ لا شيءَ يستمع. متغيّرٌ واحدٌ مضبوطٌ من اثنَين يبدو كإصلاحٍ
      # ولا يُصلِحُ شيئاً.
      #
      # ويحملُ `/api/v1` لأنّ ذاك العميلَ يُلحِقُ المسارَ به مباشرةً.
      MARKETPLACE_API_URL: http://nginx:8081/api/v1
    networks: [elmotamayez]
    depends_on:
      backend: { condition: service_started }

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # ⚠️ `/nginx-health` مسارٌ يردُّه nginx بنفسِه ولا يمرُّ بخادمٍ خلفيّ — انظر
    # `nginx.prod.conf`. فحصٌ على `/` يمرُّ إلى Next ثمّ إلى الـAPI، فيقيسُ
    # ثلاثَ حاوياتٍ ويُسمّي الأولى. و`wget` من BusyBox موجودٌ في `nginx:alpine`
    # بينما `curl` ليسَ كذلك.
    #
    # ⚠️ والمنفذُ **٨٠٨١ لا ٨٠**، وهذا هو ما أعطبَ الفحصَ منذُ أوّلِ نشرة: كتلةُ
    # المنفذِ ٨٠ تُحوِّلُ كلَّ شيءٍ إلى https، فيتبعُ `wget` التحويلةَ إلى
    # `https://127.0.0.1/…` ويسقطُ على التحقّقِ من الشهادةِ — اسمُ المضيفِ ليسَ
    # النطاق. قِيسَ على الخادمِ في ٢٠٢٦-٠٩-٠٩: `certificate verify failed` ثمّ
    # `Connection reset by peer`، وnginx `unhealthy` بينما الفحصُ الدخانيُّ يردُّ
    # ٢٠٠ من الخارج — أي اتّهامُ حاويةٍ سليمةٍ بعطبٍ في الفاحصِ نفسِه.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      # ⚠️ المرفوعاتُ وحدَها، ولا نسخةَ من شيفرةِ PHP هنا. nginx يُمرِّرُ كلَّ طلبٍ
      # ديناميٍّ إلى FPM بمُتحكِّمٍ أماميٍّ واحد، وFPM يقرأُ الملفَّ من صورتِه هو —
      # فمُجلَّدٌ مشترَكٌ للشيفرةِ يعني نسختَين تتباعدان عندَ أوّلِ نشرةٍ لا تُحدِّثُه.
      - storage:/var/www/html/storage/app:ro
      # ⚠️ أصولُ Filament الساكنة — و**هذا ليس نقضاً للقاعدةِ أعلاه**.
      # اللوحةُ تطلبُ `/css/filament/...` و`/js/filament/...`، وهي ملفّاتٌ ساكنةٌ
      # لا يستطيعُ FPM خدمتَها (ينفّذُ PHP فقط). وبلا نسخةٍ هنا لا يُطابِقُها أيُّ
      # `location`، فتسقطُ إلى `location /` وتذهبُ إلى Next.js التي تردُّ ٤٠٤ —
      # فتُفتَحُ اللوحةُ **بلا تنسيقاتٍ ولا جافاسكربت**، وصفحةُ HTML سليمةٌ ٢٠٠
      # فوقَها، فلا فحصُ حالةٍ يراها.
      #
      # وهي للقراءةِ فقط ولا تتباعد: الملفّاتُ الـ٤٧ **متتبَّعةٌ في git**، والصورةُ
      # تنسخُها من الشجرةِ نفسِها التي يُثبِّتُها `git reset --hard` في كلِّ نشرة —
      # مصدرٌ واحدٌ وcommit واحد. مُجلَّدٌ مُسمًّى كان سيتجمَّدُ على أوّلِ محتوًى.
      - ../backend/public:/var/www/html/public:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    environment:
      # قالبٌ لا ملفٌّ ثابت: `envsubst` يملأُ اسمَ النطاقِ عندَ الإقلاع، فالنطاقُ
      # يعيشُ في `.env` مع بقيّةِ الإعداداتِ بدلاً من نسخةٍ معدَّلةٍ باليد.
      DOMAIN: ${DOMAIN}
    networks: [elmotamayez]
    depends_on:
      backend: { condition: service_started }
      frontend: { condition: service_started }

  # ⚠️ التجديدُ حلقةٌ لا مهمّةٌ لمرّةٍ واحدة. شهادةُ Let's Encrypt تسعون يوماً،
  # والنشرةُ التي تُصدِرُها يدويّاً تنتهي بعدَ ثلاثةِ أشهرٍ في يومٍ لا أحدَ يتوقّعُه.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [elmotamayez]
    # ⚠️ الفحصُ الصحّيُّ ليس زينة: MySQL يقبلُ اتّصالاتٍ قبلَ أن يُنهيَ تهيئتَه،
    # فـ`depends_on` بلا شرطٍ يُشغِّلُ الهجراتِ على خادمٍ يرُدُّ «connection refused»
    # ثمّ تُقرَأُ النشرةُ الفاشلةُ على أنّها خطأٌ في الكود.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # الاستمرارُ على القرص: الطابورُ يعيشُ هنا، وإعادةُ تشغيلٍ بلا AOF تفقدُ كلَّ
    # مهمّةٍ لم تُصرَفْ بعد — إشعاراتٍ وتسجيلاتٍ وتقاريرَ لا سبيلَ إلى إعادتِها.
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [elmotamayez]

  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data
    networks: [elmotamayez]

networks:
  elmotamayez:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  meili-data:
  storage:
  certbot-www:
  certbot-conf:
