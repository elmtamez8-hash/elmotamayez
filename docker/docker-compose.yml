services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: elmotamayez-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    networks:
      - elmotamayez
    depends_on:
      - mysql
      - redis
      - meilisearch
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=elmotamayez
      - DB_USERNAME=elmotamayez
      - DB_PASSWORD=secret
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - SCOUT_DRIVER=meilisearch
      - SCOUT_MEILISEARCH_HOST=http://meilisearch:7700

  horizon:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: elmotamayez-horizon
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan horizon
    volumes:
      - ../backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    networks:
      - elmotamayez
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: elmotamayez-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - elmotamayez
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://nginx/api

  nginx:
    image: nginx:alpine
    container_name: elmotamayez-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../backend/public:/var/www/html/public
    networks:
      - elmotamayez
    depends_on:
      - backend
      - frontend

  mysql:
    image: mysql:8.0
    container_name: elmotamayez-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=elmotamayez
      - MYSQL_USER=elmotamayez
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - elmotamayez

  redis:
    image: redis:7-alpine
    container_name: elmotamayez-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - elmotamayez

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: elmotamayez-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=meili-master-key-change-me
    volumes:
      - meili-data:/meili_data
    networks:
      - elmotamayez

networks:
  elmotamayez:
    driver: bridge

volumes:
  backend-vendor:
  mysql-data:
  redis-data:
  meili-data:
